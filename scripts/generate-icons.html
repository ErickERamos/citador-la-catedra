<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<canvas id="canvas"></canvas>
<script>
// Generate PNG icons for the Chrome extension
function generateIcon(size) {
  const canvas = document.getElementById('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Background: primary blue
  ctx.fillStyle = '#214066';
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, size * 0.18);
  ctx.fill();

  // Cyan accent line at bottom
  ctx.fillStyle = '#46c6e6';
  ctx.fillRect(size * 0.15, size * 0.82, size * 0.7, size * 0.04);

  // Quote mark symbol
  ctx.fillStyle = '#FFFFFF';
  ctx.font = `bold ${size * 0.5}px "Lora", Georgia, serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('"', size * 0.5, size * 0.45);

  return canvas.toDataURL('image/png');
}

[16, 48, 128].forEach(size => {
  const dataUrl = generateIcon(size);
  const link = document.createElement('a');
  link.download = `icon${size}.png`;
  link.href = dataUrl;
  link.click();
});
</script>
</body>
</html>
